services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: querymind-frontend
    ports:
      - "5173:4173"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: querymind-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env